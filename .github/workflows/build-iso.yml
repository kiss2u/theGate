name: Generate Gateway Warrior ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake clang llvm libelf-dev libbpf-dev \
          libncurses5-dev libssl-dev texinfo \
          unzip help2man bc git wget cpio ccache rsync xorriso locales

    # === 编译 xdns-bpf (CMake，GATEWAY 模式) ===
    - name: Build xdns-bpf
      run: |
        git clone https://github.com/liudf0716/xdns-bpf.git --depth=1 /tmp/xdns-bpf
        cmake -B /tmp/xdns-bpf/build -S /tmp/xdns-bpf -DXDNS_MODE=GATEWAY
        cmake --build /tmp/xdns-bpf/build
        ls -la /tmp/xdns-bpf/build/xdns_bpf.o /tmp/xdns-bpf/build/xdns-ctl

    # === 构建 Buildroot 骨架 ===
    - name: Clone Buildroot
      run: |
        git clone https://github.com/buildroot/buildroot.git --depth=1 -b 2024.02.x "$WORK/buildroot"

    - name: Assemble Rootfs Skeleton
      run: |
        SKEL="$WORK/buildroot/system/skeleton"
        mkdir -p "$SKEL/lib/bpf" "$SKEL/usr/bin"

        # xdns-bpf 产物
        cp /tmp/xdns-bpf/build/xdns_bpf.o "$SKEL/lib/bpf/"
        cp /tmp/xdns-bpf/build/xdns-ctl   "$SKEL/usr/bin/"
        chmod +x "$SKEL/usr/bin/xdns-ctl"

        # xray-lite 最新 Release — tarball 内单文件名为 xray-linux-amd64-xdp
        XL_URL=$(curl -s https://api.github.com/repos/undead-undead/xray-lite/releases/latest \
          | grep -o '"browser_download_url": "[^"]*linux-amd64.tar.gz"' | head -1 | cut -d '"' -f 4)
        echo "xray-lite URL: $XL_URL"
        wget -q "$XL_URL" -O /tmp/xray-lite.tar.gz
        tar -xzf /tmp/xray-lite.tar.gz -C /tmp/
        mv /tmp/xray-linux-amd64-xdp "$SKEL/usr/bin/xray-lite"
        chmod +x "$SKEL/usr/bin/xray-lite"

        # AdGuardHome 最新 Release — tarball 内含 AdGuardHome/AdGuardHome
        AGH_URL=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest \
          | grep -o '"browser_download_url": "[^"]*linux_amd64.tar.gz"' | head -1 | cut -d '"' -f 4)
        echo "AdGuardHome URL: $AGH_URL"
        wget -q "$AGH_URL" -O /tmp/AdGuardHome.tar.gz
        tar -xzf /tmp/AdGuardHome.tar.gz -C /tmp/
        mv /tmp/AdGuardHome/AdGuardHome "$SKEL/usr/bin/AdGuardHome"
        chmod +x "$SKEL/usr/bin/AdGuardHome"

    - name: Apply Overlay
      run: |
        rsync -a "$WORK/overlay/" "$WORK/buildroot/system/skeleton/"
        chmod +x "$WORK/buildroot/system/skeleton/etc/init.d/S99gateway"

    # === 配置 Buildroot：defconfig → 追加自定义 → 合入内核片段 ===
    - name: Configure Buildroot
      run: |
        cd "$WORK/buildroot"
        make defconfig
        cat "$WORK/configs/gateway_defconfig" >> .config
        support/kconfig/merge_config.sh .config "$WORK/configs/kernel.fragment"
        make olddefconfig
        echo "--- Final .config summary ---"
        grep -E "^BR2_TARGET_ROOTFS_ISO|^BR2_PACKAGE_(IPROUTE|QEMU|LIBELF|LIBBPF|BPFTOOL|IPTABLES)" .config

    - name: Compile ISO
      run: |
        cd "$WORK/buildroot"
        make -j$(nproc)

    - name: Rename ISO with Date
      run: |
        cd "$WORK/buildroot/output/images"
        ISO_SRC="rootfs.iso9660"
        ISO_DST="theGate_$(date +%Y%m%d).iso"
        if [ ! -f "$ISO_SRC" ]; then
          echo "❌ ISO not found: $ISO_SRC"
          ls -la
          exit 1
        fi
        cp "$ISO_SRC" "$ISO_DST"
        echo "ISO_NAME=$ISO_DST" >> "$GITHUB_ENV"
        echo "Built: $ISO_DST ($(stat -c %s "$ISO_DST") bytes)"

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: theGate-iso
        path: buildroot/output/images/${{ env.ISO_NAME }}
